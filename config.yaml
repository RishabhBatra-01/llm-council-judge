# =============================================================================
# LLM Council configuration
#
# Everything here can change a decision, which is why the whole file is
# fingerprinted into provenance.config_hash. Two Decision Objects claiming to
# be comparable must have come from identical settings, prompt text included.
#
# Free catalogue checked 2026-08-30. Model IDs are pinned, not auto-routed:
# a reproducible run needs to know exactly who answered.
# =============================================================================

models:
  # Three distinct families. The same model three times is not a council -
  # it is one model with correlated errors and a louder voice.
  generators:
    - model_id: "nvidia/nemotron-3-super-120b-a12b:free"
      family: "nvidia"
    - model_id: "inclusionai/ling-3.0-flash-fin:free"
      family: "inclusionai"
      note: "the 'fin' suffix suggests finance tuning - possible domain skew"
    - model_id: "dots-studio/dots-3-note-preview:free"
      family: "dots-studio"

  # Neither judge shares a family with any generator. The brief asks for this
  # 'ideally'; we meet the stronger version.
  #
  # One code-tuned judge (reliable structured output) and one general judge
  # (judgment quality). Two code-tuned judges would share blind spots and agree
  # for reasons unrelated to answer quality - trap #2 in the judging layer.
  judges:
    - model_id: "minimax/minimax-m3:free"
      family: "minimax"
    - model_id: "cohere/north-mini-code:free"
      family: "cohere"

  # Tried in order when a pinned model is permanently unavailable (403/404).
  # A 429 is retried, not replaced - it means busy, not gone.
  backups:
    - model_id: "poolside/laguna-s-2.1:free"
      family: "poolside"
    - model_id: "z-ai/glm-5.2:free"
      family: "z-ai"
      note: "persistently 429 upstream on 2026-08-30"
    - model_id: "liquid/lfm-2.5-2.6b:free"
      family: "liquid"
      note: "WEAK - 2.6B params, 65k context. Last resort. If promoted, say so."

  # Dropped permanently, with cause.
  unavailable:
    - model_id: "thinkingmachines/inkling:free"
      reason: "HTTP 403, permanent: 'only available on agentic harnesses'"
    - model_id: "google/gemma-4-31b-it:free"
      reason: "HTTP 429 upstream on every attempt 2026-08-30"

# -----------------------------------------------------------------------------
# The rubric judges score against. Weights are OURS - judges never see them.
# Handing a judge the weights invites it to pre-aggregate and bias its scores.
# The judge scores; the aggregator weights.
# -----------------------------------------------------------------------------
rubric:
  criteria:
    accuracy: 0.40      # are the factual claims correct? invented facts/sources?
    calibration: 0.25   # does certainty match evidence? does it flag what it doesn't know?
    completeness: 0.20  # does it address every part of the question asked?
    reasoning: 0.15     # is the logic sound, do conclusions follow?
  score_min: 0
  score_max: 5

  # Deliberately absent: clarity, writing quality, helpfulness, tone.
  # A council that rewards eloquence systematically prefers the most
  # confident-sounding answer - the exact failure we are built to prevent.

# -----------------------------------------------------------------------------
# Confidence. Observable signals only. No model is ever asked how sure it feels.
# -----------------------------------------------------------------------------
confidence:
  signal_weights:
    inter_judge_agreement: 0.35
    score_margin: 0.20
    # score_margin measures SEPARATION, not quality. Three candidates all at
    # 5.0 and three all at 2.0 both give a margin near zero - identical signal,
    # opposite realities. Absolute quality is what tells them apart.
    winner_quality: 0.20
    # Deliberately LOW. Three models agreeing may be one wrong prior shared
    # three times. Agreement is real evidence, but weak, and we can never tell
    # from the agreement itself which kind we have.
    agent_agreement: 0.10
    verification_pass_rate: 0.15

  # Ceilings, not penalties. An average lets one strong signal hide a serious
  # problem; a ceiling cannot be averaged away. Lowest triggered ceiling wins.
  caps:
    judges_disagree_on_winner: 0.45
    single_effective_judge: 0.50
    judge_failed: 0.50
    judge_contamination: 0.40
    citation_failed: 0.50
    reduced_generator_pool: 0.75

thresholds:
  # A 1.0-point gap on the 0-5 weighted scale counts as a decisive margin.
  # Judges spread candidates by well under a point in practice, so normalising
  # by the full 0-5 range would make every real margin look negligible.
  margin_full_scale: 1.0

  # A judge whose weighted totals span less than this expressed no preference.
  # Observed live: a judge returned a valid scorecard of 5/5/5/5 for every
  # candidate. Numerically close to the other judge, so a naive agreement
  # signal would read it as HIGH agreement while it said nothing at all.
  discrimination: 0.05

  # Two candidates closer than this on the combined score are tied, not ranked.
  tie_epsilon: 0.10

  # Below this, the judges disagreed enough that the decision carries an
  # explicit ambiguity risk even when a winner was found. The brief allows an
  # ambiguous question to resolve as "no_decision OR a flagged ambiguity risk";
  # deciding silently is the failure, not deciding.
  low_judge_agreement: 0.50

  # Below this we decline rather than decide.
  no_decision: 0.35

# -----------------------------------------------------------------------------
# Generation settings
# -----------------------------------------------------------------------------
generation:
  temperature: 0        # best available shot at reproducibility; not a guarantee

  # 1500 starved dots-studio on a hard question: all 1500 tokens spent
  # reasoning, zero characters of answer produced.
  generator_max_tokens: 3000

  # Judges read three answers and emit JSON. 2000 truncated cohere - it spent
  # ~1900 tokens reasoning and never reached the JSON.
  judge_max_tokens: 6000

  # ~20 requests/min free-tier ceiling. Sequential calls with a pause is a
  # deliberate choice under a rate limit, not a performance oversight.
  pause_between_calls: 2.0

client:
  timeout_seconds: 60
  max_attempts: 3
  base_backoff_seconds: 2.0     # 2s -> 4s -> 8s
  retryable_status: [429, 500, 502, 503, 504]   # busy / hiccup
  fatal_status: [400, 401, 403, 404]            # never retry; burns quota

# -----------------------------------------------------------------------------
# Citations. Reachability is not truth - see README section 7.
# -----------------------------------------------------------------------------
citations:
  timeout_seconds: 6
  max_per_run: 8
  # Share of the claim's content words that must appear in the fetched page
  # before we call a citation 'verified' rather than merely 'unverified'.
  claim_overlap_threshold: 0.4
  user_agent: "llm-council-citation-check/1.0"

# -----------------------------------------------------------------------------
# Judge output handling
# -----------------------------------------------------------------------------
judging:
  max_justification_chars: 300
  # A judge that starts answering the question has stopped being a judge.
  contamination_phrases:
    - "the correct answer is"
    - "the answer is"
    - "here is my answer"
    - "my answer:"
    - "i would answer"
    - "the right answer"

# -----------------------------------------------------------------------------
# Prompts are part of the config because they change decisions. Editing them
# changes config_hash, which is correct: runs under different prompts are not
# comparable.
# -----------------------------------------------------------------------------
abstain_marker: "INSUFFICIENT_INFORMATION"

prompts:
  generator_system: |
    You are one member of an independent expert panel.
    Answer the question directly and completely.

    Rules:
    - Answer only from what you actually know. Never invent facts, figures, or sources.
    - If you cannot answer reliably, reply with exactly INSUFFICIENT_INFORMATION on the first
      line, then one sentence saying what is missing.
    - If a factual claim rests on a source, put the full URL inline in that sentence.
    - Do NOT rate your own confidence. No percentages, no "I am 90% sure".
    - Keep your answer under 250 words.

  judge_system: |
    You are a judge on an evaluation panel.
    Your ONLY job is to score candidate answers against a rubric.

    Absolute rules:
    - You must NOT write your own answer to the question, not even partially.
    - You must NOT rewrite, improve, or correct any candidate answer.
    - You score only what is written in front of you.
    - Return ONLY a single JSON object. No markdown fences, no commentary.
